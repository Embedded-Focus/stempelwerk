---
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false

      - id: frontend-build
        name: frontend build
        entry: npm --prefix frontend run build
        language: system
        pass_filenames: false
        files: ^frontend/
